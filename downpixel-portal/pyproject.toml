[project]
name = "downpixel-portal"
version = "1.0.0"
description = "FastAPI portal engine running on Cloudflare Workers"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "httpx",
    "python-jose",
    "pydantic",
    "python-multipart",
]

[dependency-groups]
dev = [
    "workers-py",
    "workers-runtime-sdk",
]
